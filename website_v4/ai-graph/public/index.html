<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Graph Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="chart.js"></script>
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #f9fafb;
      padding: 40px;
      color: #111;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      margin-top: 10px;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
    canvas {
      margin-top: 30px;
      background: white;
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <h1>🧠 AI Graph Generator</h1>
  <p>Describe any chart you want below:</p>

  <textarea id="prompt" placeholder="Example: Show a bar chart of monthly sales for 2024."></textarea>
  <br>
  <button id="generate">Generate Graph</button>
  <div id="loader" hidden>
    <p>🧠 Generating chart... please wait</p>
  </div>
  <script></script>


  <canvas id="chart" width="600" height="300"></canvas>
</body>
</html>
